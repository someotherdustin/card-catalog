name: Helper evals

# Runs the card-catalog-helpers eval suite with `claude plugin eval`. Each run
# costs API calls, so it's started by hand before a release that changes the
# helpers, never on pull requests. See card-catalog-helpers/evals/README.md.

on:
  workflow_dispatch:
    inputs:
      max-cost-usd:
        description: Stop starting runs once the suite has cost this much
        default: "15"
      threshold:
        description: Fail when any case scores below this (0 to 1)
        default: "0.6"
      case:
        description: Only run cases whose name matches this glob
        default: "*"

permissions:
  contents: read
  id-token: write # the GitHub OIDC token exchanged for Claude API access

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Workload identity federation: Claude Code exchanges a GitHub OIDC token
    # for a short-lived Claude API token, so there's no API key secret. These
    # are identifiers, not credentials; the Console's federation rule decides
    # which workflow runs may use them.
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01HcTh6V6sw9dLVvkHb6x6gx
      ANTHROPIC_ORGANIZATION_ID: c6f35acb-e2d7-4607-8101-d0e767262415
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01FhH2PUU62aVfF4AwGrDXEk
      ANTHROPIC_WORKSPACE_ID: wrkspc_01R2GvRMbxBh693xqoRAJpM5
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/github-oidc/token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The skills fall back to card-catalog on PATH when the session-start
      # message gives no CLI path; the run's sandbox has no network for npx.
      - name: Install this commit's CLI as card-catalog
        run: npm run build:npm && npm install -g ./npm && card-catalog --version
      # Claude Code's sandbox for Bash needs bubblewrap and socat on Linux.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - run: npm install -g @anthropic-ai/claude-code
      # Every claude process the suite starts exchanges the token in this file,
      # and each GitHub token can be exchanged once and lives about 5 minutes,
      # so a background loop rewrites it with a fresh one every 15 seconds for
      # the rest of the job.
      - name: Keep a fresh GitHub OIDC token on disk
        run: |
          mkdir -p -m 700 "$(dirname "$ANTHROPIC_IDENTITY_TOKEN_FILE")"
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch
          export -f fetch
          nohup bash -c 'while sleep 15; do fetch; done' >/dev/null 2>&1 &
      - name: Run the suite
        env:
          CASE: ${{ inputs.case }}
          MAX_COST_USD: ${{ inputs.max-cost-usd }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          # The repo root is the target so cases can load both plugins.
          claude plugin eval . --eval-dir card-catalog-helpers/evals \
            --case "$CASE" \
            --scaffold --trust-plugin \
            --allow-tools Bash Edit Write \
            --max-cost-usd "$MAX_COST_USD" \
            --threshold "$THRESHOLD" \
            --no-publish \
            --report eval-report.html \
            --json eval-result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helper-evals
          path: |
            eval-report.html
            eval-result.json
